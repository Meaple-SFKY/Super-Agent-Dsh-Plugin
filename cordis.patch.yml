# The bundle layer of dsh-superagent-personal.
#
# A bundle patch is an ordered list of Loader patch entries: `insert` appends
# rows, while a row with only an `id` overrides an existing row (its `config`
# is replaced wholesale, never deep-merged). The profile supplies this
# plugin's configuration (`stateDir`, sources, policy) in its own patch; see
# examples/profile.cordis.patch.yml. The plugin refuses to start without
# `stateDir` and reports a degraded status instead of failing the host.
#
# This file is also the only place the two agent presets are declared. The
# runtime selects them when it creates its Sessions:
#   - `superagent-worker` — one isolated Executor Session per Ticket.
#   - `superagent-router` — the long-lived main Session that judges candidates.
# Keep both rows: a Session cannot be created or resumed without its preset.
- insert:
    # The single Host plugin row. `src/index.ts` is a dependency-free guardian
    # that dynamically imports `src/engine.ts`, so an engine-side failure only
    # degrades this plugin and never blocks DSH boot.
    - id: dsh-superagent-personal
      name: dsh-superagent-personal

    # Agent preset of every Executor Session. It is DSH's `standard` preset
    # with only what a worker needs, and a shell whose foreground command
    # moves to a background job after 5 seconds, so a long command does not
    # hold back a person's message, which the Session takes at its next step.
    # Left out: questions to a person, presenting, plan mode, the plugin
    # manager and market, scheduling, goals, workflows, web fetch, and forked
    # subagents (which would inherit this preset). A preset row has no setting
    # that hides it from the preset picker, so its name and description say
    # whom it is for.
    - id: superagent-worker-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: superagent-worker
        name: Superagent 执行器
        description: Superagent 的执行器 Session 专用，不供手动选择。前台命令超 5 秒转入后台，只含执行工作所需的工具。
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # A foreground command waits at most 5 s, then the shell tool moves
          # it to a background job.
          - id: shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: pwsh-sandbox
                name: '@deepseek-ai/dsh-pwsh-sandbox'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # read_image (read-only) lets a Worker look at images the person
              # sent on Telegram or attached to an issue.
              readImage: true
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # A wait for a job ends after 5 s too; the job's end wakes the worker
          # with its result.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            config:
              waitTimeoutMs: 5000
              maxWaitTimeoutMs: 5000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
                  agentPreset: standard
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # A persisted goal keeps a large Worker task moving across automatic
          # continuation rounds. Not mounted in the Router preset.
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

    # Agent preset of the main Session. It has the same 5-second shell and job
    # waits, so a command or a wait never holds back the next candidate, and
    # only what judging and routing need: no subagents, web, file search or
    # writes, todo list, questions to a person, presenting, plan mode, plugin
    # manager, scheduling, goals or workflows. No persona: the main Session's
    # prompt is complete, so it has no other section.
    - id: superagent-router-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: superagent-router
        name: Superagent 主 Session
        description: Superagent 的主 Session 专用，不供手动选择。前台命令和任务等待超 5 秒转入后台，只含路由所需的工具。
        order: 91
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: pwsh-sandbox
                name: '@deepseek-ai/dsh-pwsh-sandbox'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # read_image is read-only: the Router can look at pictures the
              # person sent without ever writing to disk.
              readImage: true
              write: false
              edit: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            config:
              waitTimeoutMs: 5000
              maxWaitTimeoutMs: 5000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
